name: Production operations monitor

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: production-operations
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

env:
  FRONTEND_URL: https://aic.hyrin.org
  BACKEND_URL: https://aic-backend-87872864140.africa-south1.run.app
  INCIDENT_TITLE: "[Automated Operations] Production health check failed"

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check frontend and backend with retry
        id: smoke
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          check_url() {
            local name="$1" url="$2"
            echo "Checking $name: $url"
            curl --fail --silent --show-error --location               --retry 4 --retry-delay 5 --retry-all-errors               --connect-timeout 10 --max-time 30 "$url" >/dev/null
          }
          check_url "frontend" "$FRONTEND_URL/"
          check_url "backend" "$BACKEND_URL/health"
          for path in /dashboard /analysis-lab /microdata /microdata/spatial /forecast /research /datasets; do
            check_url "route $path" "$FRONTEND_URL$path"
          done

      - name: Check connector health and data freshness
        id: data
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error             --retry 3 --retry-delay 5 --retry-all-errors             --connect-timeout 10 --max-time 45             "$BACKEND_URL/api/v1/health/sources?limit=200")"
          total="$(jq -r '.total_sources // 0' <<<"$response")"
          healthy="$(jq -r '.summary.healthy // 0' <<<"$response")"
          unhealthy="$(jq -r '.summary.unhealthy // 0' <<<"$response")"
          stale="$(jq '[.sources[] | select(.last_synced_at == null)] | length' <<<"$response")"
          echo "### Data-source status" >> "$GITHUB_STEP_SUMMARY"
          echo "- Registered connectors: $total" >> "$GITHUB_STEP_SUMMARY"
          echo "- Healthy now: $healthy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Unhealthy or timed out: $unhealthy" >> "$GITHUB_STEP_SUMMARY"
          echo "- Never synchronized: $stale" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.sources[] | select(.healthy != true) | "- \(.source_name // .source_id): \(.message // "unavailable")"'             <<<"$response" >> "$GITHUB_STEP_SUMMARY"
          test "$total" -gt 0
          test "$healthy" -gt 0

      - name: Record or resolve incident
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          DATA_OUTCOME: ${{ steps.data.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open             --search "$INCIDENT_TITLE in:title" --json number --jq '.[0].number // empty')"
          if [[ "$SMOKE_OUTCOME" == "success" && "$DATA_OUTCOME" == "success" ]]; then
            if [[ -n "$existing" ]]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY"                 --body "Automated checks recovered at $(date -u +'%Y-%m-%dT%H:%M:%SZ'). Closing the incident."
              gh issue close "$existing" --repo "$GITHUB_REPOSITORY" --reason completed
            fi
          else
            body=$(printf 'Production monitoring failed at %s.\\n\\n- Application smoke checks: %s\\n- Connector/data checks: %s\\n- Workflow: %s/%s/actions/runs/%s\\n\\nThe monitor already retried transient network failures. Review the run summary and logs before making stateful repairs.' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" "$SMOKE_OUTCOME" "$DATA_OUTCOME" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")
            if [[ -n "$existing" ]]; then
              gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$INCIDENT_TITLE" --body "$body"
            fi
            exit 1
          fi
